services:
  api:
    build: ./api
    ports:
      - "8066:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ASKBOX_MASTER_KEY: ${ASKBOX_MASTER_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ASKBOX_COOKIE_SECURE: ${ASKBOX_COOKIE_SECURE:-false}
      ASKBOX_ALLOW_REGISTER: ${ASKBOX_ALLOW_REGISTER:-false}
      ASKBOX_ASK_RATE_PER_MIN: ${ASKBOX_ASK_RATE_PER_MIN:-30}
      ASKBOX_PUBLIC_URL: ${ASKBOX_PUBLIC_URL:-http://localhost:8067}
      # Swagger/ReDoc detrás del proxy Next (/api/*): rutas «Try it out» y carga del esquema.
      ASKBOX_API_EXTERNAL_PREFIX: ${ASKBOX_API_EXTERNAL_PREFIX:-/api}
      ASKBOX_RESET_TTL_MINUTES: ${ASKBOX_RESET_TTL_MINUTES:-30}
      ASKBOX_DEV_SHOW_RESET_TOKEN: ${ASKBOX_DEV_SHOW_RESET_TOKEN:-false}
      ASKBOX_LOG_RESET_LINK: ${ASKBOX_LOG_RESET_LINK:-true}
      ASKBOX_SMTP_HOST: ${ASKBOX_SMTP_HOST:-}
      ASKBOX_SMTP_PORT: ${ASKBOX_SMTP_PORT:-587}
      ASKBOX_SMTP_USER: ${ASKBOX_SMTP_USER:-}
      ASKBOX_SMTP_PASSWORD: ${ASKBOX_SMTP_PASSWORD:-}
      ASKBOX_SMTP_FROM: ${ASKBOX_SMTP_FROM:-}
      ASKBOX_SMTP_TLS: ${ASKBOX_SMTP_TLS:-starttls}
      # Pantalla /settings/git (app/gitops.py): repo montado en /repo (ver volumes).
      ASKBOX_REPO_PATH: /repo
      GIT_OPTIONAL_LOCKS: "0"          # git status no reescribe .git/index
      GIT_CONFIG_COUNT: "2"            # los repos son del uid del host, no del usuario del contenedor
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /repos/cursor-agent-orchestrator
      # Repos adicionales gestionables desde /settings/git (?repo=<nombre>), "nombre=ruta,...".
      ASKBOX_EXTRA_REPOS: ${ASKBOX_EXTRA_REPOS:-cursor-agent-orchestrator=/repos/cursor-agent-orchestrator}
    # Mismo uid/gid que el dueño del repo en el host: los ficheros que escriba git
    # (.git/config) y .askbox/ no quedan como root. Ajusta en .env si tu uid no es 1000.
    user: "${ASKBOX_UID:-1000}:${ASKBOX_GID:-1000}"
    volumes:
      # Árbol del proyecto en solo lectura (git status necesita el worktree)...
      - ./:/repo:ro
      # ...salvo lo que gitops debe escribir (remotos/config y preferencias no secretas).
      - ./.git:/repo/.git:rw
      - ./.askbox:/repo/.askbox:rw
      # ...y el .env real NUNCA es legible dentro del contenedor (secretos van por environment).
      - /dev/null:/repo/.env:ro
      # Kit de orquestación (hermano en el host): árbol ro + .git rw, para crear su remoto/push
      # con el GitHub token guardado. Si no existe en tu host, quita estas dos líneas y
      # ASKBOX_EXTRA_REPOS (si no, Docker crearía el directorio vacío como root).
      - ${ASKBOX_KIT_PATH:-../cursor-agent-orchestrator}:/repos/cursor-agent-orchestrator:ro
      - ${ASKBOX_KIT_PATH:-../cursor-agent-orchestrator}/.git:/repos/cursor-agent-orchestrator/.git:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: ./api
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
      - db
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8067:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Opcional: solo con `docker compose --profile tunnel up -d` y CLOUDFLARE_TUNNEL_TOKEN en .env
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: askbox-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?define CLOUDFLARE_TUNNEL_TOKEN en .env para el profile tunnel}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-askbox}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
